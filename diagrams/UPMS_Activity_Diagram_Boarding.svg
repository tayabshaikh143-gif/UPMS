<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-boarding-title upms-boarding-desc" id="UPMS_Activity_Diagram_Boarding-root">
        <title id="upms-boarding-title">UPMS boarding activity</title>
        <desc id="upms-boarding-desc">Activity diagram of ticket validation at boarding: the staff scan a ticket, reject expired or reused tickets, collect pending cash, and mark the passenger as boarded.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Activity_Diagram_Boarding-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Activity_Diagram_Boarding-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Activity_Diagram_Boarding-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Activity_Diagram_Boarding-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Activity_Diagram_Boarding-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="UPMS_Activity_Diagram_Boarding-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="400" y1="74" x2="400" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <line x1="400" y1="152" x2="400" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <line x1="510" y1="226" x2="566" y2="226" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <line x1="400" y1="276" x2="400" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <line x1="510" y1="366" x2="576" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <line x1="400" y1="416" x2="400" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <path d="M 690 394 V 532 Q 690 540 682 540 H 544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>
        <line x1="400" y1="564" x2="400" y2="605" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow)"/>

        <circle cx="400" cy="64" r="10" fill="#2d3142"/>

        <rect x="280" y="96" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Passenger presents ticket</text>
        <text x="400" y="136" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">QR code · booking reference</text>

        <polygon points="400,176 510,226 400,276 290,226" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ticket valid &amp;</text>
        <text x="400" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">unused?</text>

        <rect x="570" y="198" width="220" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="680" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Boarding denied</text>
        <text x="680" y="238" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">expired or already used</text>

        <polygon points="400,316 510,366 400,416 290,366" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cash payment</text>
        <text x="400" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">due?</text>

        <rect x="580" y="338" width="220" height="56" rx="6" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.08"/>
        <text x="690" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collect cash &amp; record</text>
        <text x="690" y="378" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payment completed</text>

        <rect x="260" y="500" width="280" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="400" y="528" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mark passenger boarded</text>
        <text x="400" y="546" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">boarding recorded once</text>

        <circle cx="400" cy="620" r="11" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="400" cy="620" r="5" fill="#2d3142"/>

        <rect x="519" y="206" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="534" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="408" y="287" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="425" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="519" y="346" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="408" y="446" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="423" y="455" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <line x1="40" y1="660" x2="960" y2="660" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <circle cx="46" cy="696" r="5" fill="#2d3142"/>
        <text x="62" y="699" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

        <rect x="140" y="688" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="178" y="699" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Action</text>

        <polygon points="300,696 312,688 324,696 312,704" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="334" y="699" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <circle cx="440" cy="696" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="440" cy="696" r="3" fill="#2d3142"/>
        <text x="456" y="699" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final</text>

        <line x1="560" y1="696" x2="596" y2="696" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Activity_Diagram_Boarding-arrow-accent)"/>
        <text x="606" y="699" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal rule</text>
      </svg>
