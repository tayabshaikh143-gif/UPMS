<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPMS — Delay activity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Activity · UPMS delay</p>
    <h1>When a trip is delayed</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-delay-title upms-delay-desc">
        <title id="upms-delay-title">UPMS delay activity</title>
        <desc id="upms-delay-desc">Activity diagram of reporting a delayed trip: the driver reports a reason and new ETA, the administrator reviews it, updates the trip time and notifies affected passengers.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="400" y1="74" x2="400" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="152" x2="400" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="236" x2="400" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="510" y1="334" x2="566" y2="334" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="384" x2="400" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="468" x2="400" y2="492" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="400" y1="552" x2="400" y2="589" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <circle cx="400" cy="64" r="10" fill="#2d3142"/>

        <rect x="280" y="96" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Driver reports delay</text>
        <text x="400" y="136" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reason + revised ETA</text>

        <rect x="280" y="180" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admin reviews incident</text>
        <text x="400" y="220" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alert raised in system</text>

        <polygon points="400,284 510,334 400,384 290,334" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bus can</text>
        <text x="400" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">continue?</text>

        <rect x="570" y="306" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="690" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Escalate to breakdown</text>
        <text x="690" y="346" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">see breakdown activity</text>

        <rect x="280" y="412" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Update trip ETA</text>
        <text x="400" y="452" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">new departure time</text>

        <rect x="250" y="496" width="300" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="400" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notify affected passengers</text>
        <text x="400" y="536" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in-app notification</text>

        <circle cx="400" cy="600" r="11" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="400" cy="600" r="5" fill="#2d3142"/>

        <rect x="519" y="314" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="534" y="323" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="408" y="395" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="425" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <line x1="40" y1="640" x2="960" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <circle cx="46" cy="676" r="5" fill="#2d3142"/>
        <text x="62" y="679" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

        <rect x="140" y="668" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="178" y="679" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Action</text>

        <polygon points="300,676 312,668 324,676 312,684" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="334" y="679" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <circle cx="440" cy="676" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="440" cy="676" r="3" fill="#2d3142"/>
        <text x="456" y="679" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final</text>

        <line x1="560" y1="676" x2="596" y2="676" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="606" y="679" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal rule</text>
      </svg>
    </div>
  </div>
</body>
</html>
