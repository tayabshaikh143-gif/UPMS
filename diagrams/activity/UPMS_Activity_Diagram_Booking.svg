<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-booking-title upms-booking-desc" id="UPMS_Activity_Diagram_Booking-root">
        <title id="upms-booking-title">UPMS ticket booking activity</title>
        <desc id="upms-booking-desc">Activity diagram of a passenger booking a university transport ticket: selecting a trip, checking capacity, choosing online or cash payment, and confirming the booking.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Activity_Diagram_Booking-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Activity_Diagram_Booking-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Activity_Diagram_Booking-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Activity_Diagram_Booking-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Activity_Diagram_Booking-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="UPMS_Activity_Diagram_Booking-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, behind the nodes -->
        <line x1="400" y1="74" x2="400" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="400" y1="152" x2="400" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="510" y1="226" x2="566" y2="226" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="400" y1="276" x2="400" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="290" y1="366" x2="234" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="510" y1="366" x2="586" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="700" y1="394" x2="700" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="790" y1="470" x2="816" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <path d="M 700 516 V 552 Q 700 560 692 560 H 544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <path d="M 135 394 V 552 Q 135 560 143 560 H 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow)"/>
        <line x1="400" y1="592" x2="400" y2="605" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow-accent)"/>

        <!-- Start -->
        <circle cx="400" cy="64" r="10" fill="#2d3142"/>

        <!-- Action: search and select -->
        <rect x="280" y="96" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Search routes &amp; select trip</text>
        <text x="400" y="136" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">timetable · fare · seats</text>

        <!-- Decision: capacity -->
        <polygon points="400,176 510,226 400,276 290,226" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capacity</text>
        <text x="400" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">available?</text>

        <!-- Terminal: fully booked -->
        <rect x="570" y="198" width="220" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="680" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip fully booked</text>
        <text x="680" y="238" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no seats to sell</text>

        <!-- Decision: payment method -->
        <polygon points="400,316 510,366 400,416 290,366" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment</text>
        <text x="400" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">method?</text>

        <!-- Action: cash at boarding (light neutral tint) -->
        <rect x="40" y="338" width="190" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="135" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cash at boarding</text>
        <text x="135" y="378" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payment pending</text>

        <!-- Action: pay online (light blue-grey tint) -->
        <rect x="590" y="338" width="220" height="56" rx="6" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.08"/>
        <text x="700" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pay online</text>
        <text x="700" y="378" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">payment provider</text>

        <!-- Decision: payment approved -->
        <polygon points="700,424 790,470 700,516 610,470" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment</text>
        <text x="700" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">approved?</text>

        <!-- Terminal: booking failed -->
        <rect x="820" y="442" width="160" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="900" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking failed</text>
        <text x="900" y="482" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no capacity held</text>

        <!-- Action: confirm (focal) -->
        <rect x="260" y="528" width="280" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="400" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Confirm booking</text>
        <text x="400" y="574" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issue digital ticket</text>

        <!-- Final node -->
        <circle cx="400" cy="620" r="11" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="400" cy="620" r="5" fill="#2d3142"/>

        <!-- Arrow labels (masked) -->
        <rect x="519" y="206" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="534" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="408" y="287" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="425" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="239" y="346" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="261" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CASH</text>

        <rect x="513" y="346" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="539" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ONLINE</text>

        <rect x="780" y="480" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="795" y="489" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="708" y="528" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="725" y="537" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Legend -->
        <line x1="40" y1="700" x2="960" y2="700" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <circle cx="46" cy="736" r="5" fill="#2d3142"/>
        <text x="62" y="739" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

        <rect x="140" y="728" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="178" y="739" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Action</text>

        <polygon points="300,736 312,728 324,736 312,744" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="334" y="739" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <circle cx="440" cy="736" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="440" cy="736" r="3" fill="#2d3142"/>
        <text x="456" y="739" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final</text>

        <line x1="560" y1="736" x2="596" y2="736" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Activity_Diagram_Booking-arrow-accent)"/>
        <text x="606" y="739" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Confirmed path</text>
      </svg>
