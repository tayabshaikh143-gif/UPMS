<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-noshow-title upms-noshow-desc" id="UPMS_Activity_Diagram_NoShow-root">
        <title id="upms-noshow-title">UPMS cash no-show activity</title>
        <desc id="upms-noshow-desc">Activity diagram of the cash no-show rule: at five minutes before departure an unboarded cash booking expires, its capacity is released, and staff may sell an offline ticket to a passenger who is present.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Activity_Diagram_NoShow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Activity_Diagram_NoShow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Activity_Diagram_NoShow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Activity_Diagram_NoShow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Activity_Diagram_NoShow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="UPMS_Activity_Diagram_NoShow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="400" y1="74" x2="400" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="400" y1="152" x2="400" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="510" y1="226" x2="566" y2="226" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="400" y1="276" x2="400" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="400" y1="356" x2="400" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="290" y1="450" x2="244" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="400" y1="500" x2="400" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="400" y1="580" x2="400" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow)"/>
        <line x1="400" y1="660" x2="400" y2="675" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow-accent)"/>

        <circle cx="400" cy="64" r="10" fill="#2d3142"/>

        <rect x="260" y="96" width="280" height="56" rx="6" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.08"/>
        <text x="400" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Check cash bookings</text>
        <text x="400" y="136" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">T-5 minutes · unboarded</text>

        <polygon points="400,176 510,226 400,276 290,226" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Passenger</text>
        <text x="400" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">boarded?</text>

        <rect x="570" y="198" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Passenger travels</text>
        <text x="680" y="238" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">booking stands</text>

        <rect x="250" y="300" width="300" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="400" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expire booking &amp; release seat</text>
        <text x="400" y="340" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capacity free at T-5</text>

        <polygon points="400,400 510,450 400,500 290,450" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Passenger at</text>
        <text x="400" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the stop?</text>

        <rect x="40" y="422" width="200" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="140" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Seat left unsold</text>
        <text x="140" y="462" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no sale made</text>

        <rect x="280" y="524" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Issue offline ticket</text>
        <text x="400" y="564" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staff at boarding point</text>

        <rect x="280" y="604" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collect cash &amp; record</text>
        <text x="400" y="644" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ticket stored centrally</text>

        <circle cx="400" cy="690" r="11" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="400" cy="690" r="5" fill="#2d3142"/>

        <rect x="519" y="206" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="408" y="287" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="423" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="256" y="430" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="271" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="408" y="506" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="425" y="515" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <line x1="40" y1="740" x2="960" y2="740" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <circle cx="46" cy="776" r="5" fill="#2d3142"/>
        <text x="62" y="779" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

        <rect x="140" y="768" width="28" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="178" y="779" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Action</text>

        <polygon points="300,776 312,768 324,776 312,784" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="334" y="779" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <circle cx="440" cy="776" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="440" cy="776" r="3" fill="#2d3142"/>
        <text x="456" y="779" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final</text>

        <line x1="560" y1="776" x2="596" y2="776" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Activity_Diagram_NoShow-arrow-accent)"/>
        <text x="606" y="779" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal rule</text>
      </svg>
