<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-network-title upms-network-desc" id="UPMS_Class_Diagram_Network-root">
        <title id="upms-network-title">UPMS network and fleet class diagram</title>
        <desc id="upms-network-desc">Class diagram of routes, ordered stops, scheduled trips, vehicle assignments, buses and the vendor that owns them.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Class_Diagram_Network-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Class_Diagram_Network-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Class_Diagram_Network-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Class_Diagram_Network-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Class_Diagram_Network-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="UPMS_Class_Diagram_Network-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
          </marker>
          <marker id="UPMS_Class_Diagram_Network-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="UPMS_Class_Diagram_Network-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Relationships -->
        <line x1="260" y1="120" x2="378" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Network-uml-open)"/>
        <line x1="120" y1="180" x2="120" y2="238" stroke="#4f5d75" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Network-uml-diamond-filled)"/>
        <line x1="120" y1="360" x2="120" y2="438" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Network-uml-open)"/>
        <line x1="460" y1="200" x2="460" y2="278" stroke="#4f5d75" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Network-uml-diamond-filled)"/>
        <line x1="700" y1="340" x2="622" y2="340" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Network-uml-open)"/>
        <line x1="800" y1="480" x2="800" y2="402" stroke="#4f5d75" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Network-uml-diamond-hollow)"/>

        <!-- Multiplicities -->
        <rect x="264" y="102" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="111" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="344" y="102" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="358" y="111" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

        <rect x="128" y="184" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="134" y="193" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="128" y="214" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="140" y="223" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1..*</text>

        <rect x="128" y="364" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="142" y="373" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>
        <rect x="128" y="410" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="134" y="419" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <rect x="468" y="204" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="474" y="213" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="468" y="252" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="482" y="261" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

        <rect x="676" y="322" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="682" y="331" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="626" y="322" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="331" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

        <rect x="808" y="410" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="822" y="419" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>
        <rect x="808" y="456" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="814" y="465" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- Class: Route -->
        <rect x="60" y="60" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="100" x2="260" y2="100" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route</text>
        <text x="76" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ code: String</text>
        <text x="76" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: String</text>
        <text x="76" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ active: Boolean</text>

        <!-- Class: RouteStop -->
        <rect x="60" y="240" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="280" x2="260" y2="280" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RouteStop</text>
        <text x="76" y="300" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ sequence: Int</text>
        <text x="76" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ offsetMinutes: Int</text>
        <text x="76" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ isPickup: Boolean</text>

        <!-- Class: Stop -->
        <rect x="60" y="440" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="480" x2="260" y2="480" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stop</text>
        <text x="76" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: String</text>
        <text x="76" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ latitude: Decimal</text>
        <text x="76" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ longitude: Decimal</text>

        <!-- Class: Trip (focal) -->
        <rect x="380" y="60" width="200" height="140" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.04"/>
        <rect x="380" y="60" width="200" height="40" rx="6" fill="#bf4520" fill-opacity="0.10"/>
        <rect x="380" y="92" width="200" height="8" fill="#bf4520" fill-opacity="0.10"/>
        <line x1="380" y1="100" x2="580" y2="100" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <text x="480" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip</text>
        <text x="396" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ departureAt: DateTime</text>
        <text x="396" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ fare: Money</text>
        <text x="396" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ status: TripStatus</text>
        <line x1="380" y1="170" x2="580" y2="170" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <text x="396" y="190" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ remainingSeats(): Int</text>

        <!-- Class: TripVehicleAssignment -->
        <rect x="380" y="280" width="240" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="380" y1="320" x2="620" y2="320" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="500" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TripVehicleAssignment</text>
        <text x="396" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ assignedAt: DateTime</text>
        <text x="396" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ replacedAt: DateTime</text>
        <text x="396" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ reason: String</text>

        <!-- Class: Bus -->
        <rect x="700" y="280" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="700" y1="320" x2="900" y2="320" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="800" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bus</text>
        <text x="716" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ registration: String</text>
        <text x="716" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ capacity: Int</text>
        <text x="716" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ ownership: Ownership</text>

        <!-- Class: Vendor -->
        <rect x="700" y="480" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="700" y1="520" x2="900" y2="520" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="800" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vendor</text>
        <text x="716" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: String</text>
        <text x="716" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ status: ApprovalStatus</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="940" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

        <line x1="40" y1="676" x2="68" y2="676" stroke="#2d3142" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Network-uml-triangle)"/>
        <text x="76" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="188" y1="676" x2="216" y2="676" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#UPMS_Class_Diagram_Network-uml-triangle)"/>
        <text x="224" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

        <line x1="336" y1="676" x2="364" y2="676" stroke="#2d3142" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Network-uml-diamond-filled)"/>
        <text x="372" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

        <line x1="484" y1="676" x2="512" y2="676" stroke="#2d3142" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Network-uml-diamond-hollow)"/>
        <text x="520" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · has</text>

        <line x1="632" y1="676" x2="660" y2="676" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Network-uml-open)"/>
        <text x="668" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association</text>

        <line x1="780" y1="676" x2="808" y2="676" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#UPMS_Class_Diagram_Network-uml-open)"/>
        <text x="816" y="680" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>
      </svg>
