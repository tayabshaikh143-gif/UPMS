<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-ops-title upms-ops-desc" id="UPMS_Class_Diagram_Operations-root">
        <title id="upms-ops-title">UPMS operations and incidents class diagram</title>
        <desc id="upms-ops-desc">Class diagram of operational records: booking check-in, refunds, trip incidents and the notifications sent to affected passengers.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Class_Diagram_Operations-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Class_Diagram_Operations-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Class_Diagram_Operations-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Class_Diagram_Operations-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Class_Diagram_Operations-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="UPMS_Class_Diagram_Operations-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
          </marker>
          <marker id="UPMS_Class_Diagram_Operations-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="UPMS_Class_Diagram_Operations-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Relationships -->
        <line x1="260" y1="120" x2="378" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Operations-uml-open)"/>
        <path d="M 160 200 V 220 Q 160 228 168 228 H 472 Q 480 228 480 236 V 258" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Operations-uml-open)"/>
        <path d="M 260 500 H 652 Q 660 500 660 492 V 138 Q 660 130 668 130 H 698" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Operations-uml-open)"/>
        <line x1="800" y1="200" x2="800" y2="278" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Operations-uml-open)"/>

        <!-- Multiplicities -->
        <rect x="264" y="102" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="111" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="344" y="102" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="356" y="111" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <rect x="168" y="204" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="174" y="213" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="488" y="232" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="241" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <rect x="268" y="482" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="274" y="491" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="664" y="112" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="678" y="121" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

        <rect x="808" y="204" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="814" y="213" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="808" y="250" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="822" y="259" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

        <!-- Class: Booking -->
        <rect x="60" y="60" width="200" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="100" x2="260" y2="100" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking</text>
        <text x="76" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ reference: String</text>
        <text x="76" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ status: BookingStatus</text>
        <text x="76" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ method: PaymentMethod</text>
        <text x="76" y="180" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ bookedAt: DateTime</text>

        <!-- Class: CheckIn -->
        <rect x="380" y="60" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="380" y1="100" x2="580" y2="100" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="480" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CheckIn</text>
        <text x="396" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ boardedAt: DateTime</text>
        <text x="396" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ method: CheckInMethod</text>
        <text x="396" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ staffId: UUID</text>

        <!-- Class: Refund -->
        <rect x="380" y="260" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="380" y1="300" x2="580" y2="300" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="480" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refund</text>
        <text x="396" y="320" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ amount: Money</text>
        <text x="396" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ status: RefundStatus</text>
        <text x="396" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ processedAt: DateTime</text>

        <!-- Class: Incident (focal) -->
        <rect x="700" y="60" width="200" height="140" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.04"/>
        <rect x="700" y="60" width="200" height="40" rx="6" fill="#bf4520" fill-opacity="0.10"/>
        <rect x="700" y="92" width="200" height="8" fill="#bf4520" fill-opacity="0.10"/>
        <line x1="700" y1="100" x2="900" y2="100" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <text x="800" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Incident</text>
        <text x="716" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ type: IncidentType</text>
        <text x="716" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ reportedAt: DateTime</text>
        <text x="716" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ status: IncidentStatus</text>
        <text x="716" y="180" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ revisedEta: DateTime</text>

        <!-- Class: Notification -->
        <rect x="700" y="280" width="200" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="700" y1="320" x2="900" y2="320" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="800" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notification</text>
        <text x="716" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ message: String</text>
        <text x="716" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ channel: Channel</text>
        <text x="716" y="380" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ sentAt: DateTime</text>
        <text x="716" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ readAt: DateTime</text>

        <!-- Class: Trip -->
        <rect x="60" y="440" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="480" x2="260" y2="480" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trip</text>
        <text x="76" y="500" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ departureAt: DateTime</text>
        <text x="76" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ status: TripStatus</text>
        <text x="76" y="540" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ capacity: Int</text>

        <!-- Legend -->
        <line x1="40" y1="600" x2="940" y2="600" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

        <line x1="40" y1="636" x2="68" y2="636" stroke="#2d3142" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Operations-uml-triangle)"/>
        <text x="76" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="188" y1="636" x2="216" y2="636" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#UPMS_Class_Diagram_Operations-uml-triangle)"/>
        <text x="224" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

        <line x1="336" y1="636" x2="364" y2="636" stroke="#2d3142" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Operations-uml-diamond-filled)"/>
        <text x="372" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

        <line x1="484" y1="636" x2="512" y2="636" stroke="#2d3142" stroke-width="1" marker-start="url(#UPMS_Class_Diagram_Operations-uml-diamond-hollow)"/>
        <text x="520" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · has</text>

        <line x1="632" y1="636" x2="660" y2="636" stroke="#4f5d75" stroke-width="1" marker-end="url(#UPMS_Class_Diagram_Operations-uml-open)"/>
        <text x="668" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association</text>

        <line x1="780" y1="636" x2="808" y2="636" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#UPMS_Class_Diagram_Operations-uml-open)"/>
        <text x="816" y="640" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>
      </svg>
