<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPMS — Booking ER model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 900px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.1rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · UPMS booking &amp; payment</p>
    <h1>Booking &amp; payment · data model</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-er-booking-title upms-er-booking-desc">
        <title id="upms-er-booking-title">UPMS booking and payment data model</title>
        <desc id="upms-er-booking-desc">Entity-relationship model of passengers booking trips, with one payment per booking.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Relationship lines -->
        <line x1="340" y1="140" x2="560" y2="140" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="700" y1="328" x2="700" y2="398" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 620 328 V 360 H 200 V 398" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Cardinalities -->
        <rect x="350" y="126" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="357" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="516" y="126" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="525" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <rect x="712" y="338" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="719" y="349" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="712" y="366" width="30" height="14" rx="2" fill="#f5f5f5"/>
        <text x="727" y="377" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <rect x="628" y="338" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="637" y="349" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
        <rect x="208" y="366" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="215" y="377" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- Entity: Passenger -->
        <rect x="60" y="80" width="280" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="60" y="80" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="60" y="120" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="60" y1="128" x2="340" y2="128" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="80" y="98" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="80" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Passenger</text>
        <text x="80" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">name</text>
        <text x="320" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="80" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">phone</text>
        <text x="320" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="80" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">email</text>
        <text x="320" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>

        <!-- Entity: Booking (focal) -->
        <rect x="560" y="80" width="280" height="248" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="560" y="80" width="280" height="48" rx="6" fill="rgba(191,69,32,0.10)"/>
        <rect x="560" y="120" width="280" height="8" fill="rgba(191,69,32,0.10)"/>
        <line x1="560" y1="128" x2="840" y2="128" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <text x="580" y="98" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="580" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Booking</text>
        <text x="580" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="820" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ passenger_id</text>
        <text x="820" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ trip_id</text>
        <text x="820" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">reference</text>
        <text x="820" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="580" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="820" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="580" y="280" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">method</text>
        <text x="820" y="280" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="580" y="306" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">booked_at</text>
        <text x="820" y="306" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Entity: Payment -->
        <rect x="560" y="400" width="280" height="222" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="560" y="400" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="560" y="440" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="448" x2="840" y2="448" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="580" y="418" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="580" y="440" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Payment</text>
        <text x="580" y="470" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="820" y="470" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="496" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ booking_id</text>
        <text x="820" y="496" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="522" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">amount</text>
        <text x="820" y="522" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">money</text>
        <text x="580" y="548" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">method</text>
        <text x="820" y="548" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="580" y="574" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="820" y="574" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="580" y="600" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">paid_at</text>
        <text x="820" y="600" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Entity: Trip -->
        <rect x="60" y="400" width="280" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="60" y="400" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="60" y="440" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="60" y1="448" x2="340" y2="448" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="80" y="418" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="80" y="440" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Trip</text>
        <text x="80" y="470" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="470" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="496" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">departure_at</text>
        <text x="320" y="496" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="80" y="522" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">fare</text>
        <text x="320" y="522" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">money</text>
        <text x="80" y="548" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="320" y="548" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

        <!-- Legend -->
        <line x1="40" y1="660" x2="860" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="680" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="696" width="16" height="12" rx="2" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Aggregate root</text>

        <rect x="180" y="696" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Entity</text>

        <text x="286" y="706" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="302" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Primary key</text>

        <text x="404" y="706" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="420" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Foreign key</text>

        <text x="520" y="706" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="560" y="706" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cardinality</text>
      </svg>
    </div>
  </div>
</body>
</html>
