<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPMS — Incidents ER model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 900px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.1rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · UPMS incidents</p>
    <h1>Incidents &amp; notifications · data model</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-er-incidents-title upms-er-incidents-desc">
        <title id="upms-er-incidents-title">UPMS incidents and notifications data model</title>
        <desc id="upms-er-incidents-desc">Entity-relationship model of trip incidents and the notifications sent to affected passengers.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="340" y1="140" x2="560" y2="140" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 700 306 V 350 H 450 V 398" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <rect x="350" y="126" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="357" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="516" y="126" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="525" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <rect x="712" y="316" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="719" y="327" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="458" y="360" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="467" y="371" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <!-- Trip -->
        <rect x="60" y="80" width="280" height="174" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="60" y="80" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="60" y="120" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="60" y1="128" x2="340" y2="128" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="80" y="98" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="80" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Trip</text>
        <text x="80" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">departure_at</text>
        <text x="320" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="80" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">fare</text>
        <text x="320" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">money</text>
        <text x="80" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="320" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

        <!-- Incident (focal) -->
        <rect x="560" y="80" width="280" height="226" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="560" y="80" width="280" height="48" rx="6" fill="rgba(191,69,32,0.10)"/>
        <rect x="560" y="120" width="280" height="8" fill="rgba(191,69,32,0.10)"/>
        <line x1="560" y1="128" x2="840" y2="128" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <text x="580" y="98" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="580" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Incident</text>
        <text x="580" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="820" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ trip_id</text>
        <text x="820" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">type</text>
        <text x="820" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="580" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">reported_at</text>
        <text x="820" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="580" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="820" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="580" y="280" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">resolved_at</text>
        <text x="820" y="280" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Notification -->
        <rect x="310" y="400" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="310" y="400" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="310" y="440" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="310" y1="448" x2="590" y2="448" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="330" y="418" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="330" y="440" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Notification</text>
        <text x="330" y="470" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="570" y="470" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="330" y="496" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ incident_id</text>
        <text x="570" y="496" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="330" y="522" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">message</text>
        <text x="570" y="522" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="330" y="548" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">channel</text>
        <text x="570" y="548" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="330" y="574" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">sent_at</text>
        <text x="570" y="574" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="860" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="676" width="16" height="12" rx="2" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Aggregate root</text>

        <rect x="180" y="676" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Entity</text>

        <text x="286" y="686" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="302" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Primary key</text>

        <text x="404" y="686" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="420" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Foreign key</text>

        <text x="520" y="686" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="560" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cardinality</text>
      </svg>
    </div>
  </div>
</body>
</html>
