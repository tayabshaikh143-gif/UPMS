<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPMS — Fleet ER model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.1rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · UPMS trip &amp; fleet</p>
    <h1>Trip &amp; fleet · data model</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-er-network-title upms-er-network-desc">
        <title id="upms-er-network-title">UPMS trip and fleet data model</title>
        <desc id="upms-er-network-desc">Entity-relationship model of trips on routes, the vehicles assigned to each trip, and the vendors that own those buses.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="320" y1="140" x2="640" y2="140" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 180 280 V 300 H 480 V 318" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 780 560 V 540 H 622" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="640" y1="640" x2="320" y2="640" stroke="#4f5d75" stroke-width="1.2"/>

        <rect x="330" y="126" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="339" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
        <rect x="596" y="126" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="603" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <rect x="188" y="290" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="195" y="301" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="488" y="302" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="497" y="313" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <rect x="788" y="544" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="795" y="555" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="630" y="512" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="639" y="523" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <rect x="604" y="626" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="613" y="637" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
        <rect x="330" y="626" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="337" y="637" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- Trip (focal) -->
        <rect x="40" y="80" width="280" height="200" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="40" y="80" width="280" height="48" rx="6" fill="rgba(191,69,32,0.10)"/>
        <rect x="40" y="120" width="280" height="8" fill="rgba(191,69,32,0.10)"/>
        <line x1="40" y1="128" x2="320" y2="128" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <text x="60" y="98" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="60" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Trip</text>
        <text x="60" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="300" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="60" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ route_id</text>
        <text x="300" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="60" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">departure_at</text>
        <text x="300" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="60" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">fare</text>
        <text x="300" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">money</text>
        <text x="60" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="300" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

        <!-- Route -->
        <rect x="640" y="80" width="280" height="174" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="640" y="80" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="640" y="120" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="640" y1="128" x2="920" y2="128" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="660" y="98" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="660" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Route</text>
        <text x="660" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="900" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="660" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">code</text>
        <text x="900" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="660" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">name</text>
        <text x="900" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="660" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">active</text>
        <text x="900" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">bool</text>

        <!-- TripVehicleAssignment -->
        <rect x="340" y="320" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="340" y="320" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="340" y="360" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="340" y1="368" x2="620" y2="368" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="360" y="338" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="360" y="360" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">TripVehicleAssignment</text>
        <text x="360" y="390" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="600" y="390" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="360" y="416" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ trip_id</text>
        <text x="600" y="416" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="360" y="442" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ bus_id</text>
        <text x="600" y="442" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="360" y="468" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">assigned_at</text>
        <text x="600" y="468" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="360" y="494" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">replaced_at</text>
        <text x="600" y="494" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Bus -->
        <rect x="640" y="560" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="640" y="560" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="640" y="600" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="640" y1="608" x2="920" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="660" y="578" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="660" y="600" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Bus</text>
        <text x="660" y="630" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="900" y="630" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="660" y="656" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ vendor_id</text>
        <text x="900" y="656" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="660" y="682" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">registration</text>
        <text x="900" y="682" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="660" y="708" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">capacity</text>
        <text x="900" y="708" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
        <text x="660" y="734" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">ownership</text>
        <text x="900" y="734" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

        <!-- Vendor -->
        <rect x="40" y="560" width="280" height="148" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="40" y="560" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="40" y="600" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="40" y1="608" x2="320" y2="608" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="60" y="578" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="60" y="600" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Vendor</text>
        <text x="60" y="630" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="300" y="630" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="60" y="656" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">name</text>
        <text x="300" y="656" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="60" y="682" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="300" y="682" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

        <!-- Legend -->
        <line x1="40" y1="800" x2="920" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="820" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="836" width="16" height="12" rx="2" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="846" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Aggregate root</text>

        <rect x="180" y="836" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="846" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Entity</text>

        <text x="286" y="846" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="302" y="846" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Primary key</text>

        <text x="404" y="846" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="420" y="846" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Foreign key</text>

        <text x="520" y="846" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="560" y="846" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cardinality</text>
      </svg>
    </div>
  </div>
</body>
</html>
