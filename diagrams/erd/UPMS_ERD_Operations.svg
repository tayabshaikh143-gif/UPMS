<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-er-ops-title upms-er-ops-desc" id="UPMS_ERD_Operations-root">
        <title id="upms-er-ops-title">UPMS boarding and refund data model</title>
        <desc id="upms-er-ops-desc">Entity-relationship model of a booking with at most one check-in and at most one refund.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_ERD_Operations-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #UPMS_ERD_Operations-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_ERD_Operations-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_ERD_Operations-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <path d="M 410 280 V 340 H 180 V 398" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 490 280 V 340 H 720 V 398" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <rect x="422" y="290" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="429" y="301" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="188" y="350" width="30" height="14" rx="2" fill="#f5f5f5"/>
        <text x="203" y="361" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <rect x="502" y="290" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="509" y="301" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="728" y="350" width="30" height="14" rx="2" fill="#f5f5f5"/>
        <text x="743" y="361" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <!-- Booking (focal) -->
        <rect x="310" y="80" width="280" height="200" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.04"/>
        <rect x="310" y="80" width="280" height="48" rx="6" fill="#bf4520" fill-opacity="0.10"/>
        <rect x="310" y="120" width="280" height="8" fill="#bf4520" fill-opacity="0.10"/>
        <line x1="310" y1="128" x2="590" y2="128" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <text x="330" y="98" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="330" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Booking</text>
        <text x="330" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="570" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="330" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">reference</text>
        <text x="570" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="330" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="570" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="330" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">method</text>
        <text x="570" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="330" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">booked_at</text>
        <text x="570" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- CheckIn -->
        <rect x="40" y="400" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="40" y="400" width="280" height="48" rx="6" fill="#2d3142" fill-opacity="0.04"/>
        <rect x="40" y="440" width="280" height="8" fill="#2d3142" fill-opacity="0.04"/>
        <line x1="40" y1="448" x2="320" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="60" y="418" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="60" y="440" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">CheckIn</text>
        <text x="60" y="470" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="300" y="470" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="60" y="496" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ booking_id</text>
        <text x="300" y="496" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="60" y="522" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">boarded_at</text>
        <text x="300" y="522" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="60" y="548" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">method</text>
        <text x="300" y="548" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="60" y="574" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ staff_id</text>
        <text x="300" y="574" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

        <!-- Refund -->
        <rect x="580" y="400" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="580" y="400" width="280" height="48" rx="6" fill="#2d3142" fill-opacity="0.04"/>
        <rect x="580" y="440" width="280" height="8" fill="#2d3142" fill-opacity="0.04"/>
        <line x1="580" y1="448" x2="860" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="600" y="418" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="600" y="440" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Refund</text>
        <text x="600" y="470" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="840" y="470" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="600" y="496" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ booking_id</text>
        <text x="840" y="496" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="600" y="522" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">amount</text>
        <text x="840" y="522" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">money</text>
        <text x="600" y="548" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="840" y="548" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="600" y="574" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">processed_at</text>
        <text x="840" y="574" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="860" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="676" width="16" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.04"/>
        <text x="64" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Aggregate root</text>

        <rect x="180" y="676" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Entity</text>

        <text x="286" y="686" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="302" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Primary key</text>

        <text x="404" y="686" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="420" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Foreign key</text>

        <text x="520" y="686" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="560" y="686" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cardinality</text>
      </svg>
