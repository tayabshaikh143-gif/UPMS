<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPMS — People ER model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 900px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.75rem, 2.1rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · UPMS people &amp; access</p>
    <h1>People &amp; access · data model</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-er-people-title upms-er-people-desc">
        <title id="upms-er-people-title">UPMS people and access data model</title>
        <desc id="upms-er-people-desc">Entity-relationship model of the user account, optional passenger profile, staff identity and audit log.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="200" y1="280" x2="200" y2="358" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="340" y1="140" x2="560" y2="140" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 340 240 H 480 V 460 H 558" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <rect x="212" y="292" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="219" y="303" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="212" y="322" width="30" height="14" rx="2" fill="#f5f5f5"/>
        <text x="227" y="333" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <rect x="350" y="126" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="357" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="516" y="126" width="30" height="14" rx="2" fill="#f5f5f5"/>
        <text x="531" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

        <rect x="348" y="226" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="355" y="237" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="520" y="446" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="529" y="457" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <!-- User (focal) -->
        <rect x="60" y="80" width="280" height="200" rx="6" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="60" y="80" width="280" height="48" rx="6" fill="rgba(191,69,32,0.10)"/>
        <rect x="60" y="120" width="280" height="8" fill="rgba(191,69,32,0.10)"/>
        <line x1="60" y1="128" x2="340" y2="128" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <text x="80" y="98" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="80" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">User</text>
        <text x="80" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">email</text>
        <text x="320" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="80" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">password_hash</text>
        <text x="320" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="80" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">role</text>
        <text x="320" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="80" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">status</text>
        <text x="320" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

        <!-- Staff -->
        <rect x="560" y="80" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="560" y="80" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="560" y="120" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="128" x2="840" y2="128" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="580" y="98" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="580" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Staff</text>
        <text x="580" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="820" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ user_id</text>
        <text x="820" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">employee_no</text>
        <text x="820" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="580" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">position</text>
        <text x="820" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="580" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">active</text>
        <text x="820" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">bool</text>

        <!-- PassengerProfile -->
        <rect x="60" y="360" width="280" height="174" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="60" y="360" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="60" y="400" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="60" y1="408" x2="340" y2="408" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="80" y="378" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="80" y="400" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">PassengerProfile</text>
        <text x="80" y="430" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="430" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="456" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ user_id</text>
        <text x="320" y="456" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="482" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">full_name</text>
        <text x="320" y="482" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="80" y="508" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">phone</text>
        <text x="320" y="508" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>

        <!-- AuditLog -->
        <rect x="560" y="360" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="560" y="360" width="280" height="48" rx="6" fill="rgba(45,49,66,0.04)"/>
        <rect x="560" y="400" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="560" y1="408" x2="840" y2="408" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="580" y="378" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="580" y="400" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">AuditLog</text>
        <text x="580" y="430" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="820" y="430" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="456" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ actor_id</text>
        <text x="820" y="456" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="482" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">action</text>
        <text x="820" y="482" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="580" y="508" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">entity</text>
        <text x="820" y="508" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="580" y="534" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">at</text>
        <text x="820" y="534" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

        <!-- Legend -->
        <line x1="40" y1="600" x2="860" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="636" width="16" height="12" rx="2" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="646" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Aggregate root</text>

        <rect x="180" y="636" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="204" y="646" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Entity</text>

        <text x="286" y="646" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="302" y="646" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Primary key</text>

        <text x="404" y="646" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="420" y="646" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Foreign key</text>

        <text x="520" y="646" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="560" y="646" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cardinality</text>
      </svg>
    </div>
  </div>
</body>
</html>
