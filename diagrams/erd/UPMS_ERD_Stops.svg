<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-er-stops-title upms-er-stops-desc" id="UPMS_ERD_Stops-root">
        <title id="upms-er-stops-title">UPMS route stops data model</title>
        <desc id="upms-er-stops-desc">Entity-relationship model of routes made of ordered route stops, each pointing at a physical stop.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_ERD_Stops-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #UPMS_ERD_Stops-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_ERD_Stops-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_ERD_Stops-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="340" y1="140" x2="560" y2="140" stroke="#4f5d75" stroke-width="1.2"/>
        <path d="M 700 280 V 340 H 450 V 398" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

        <rect x="350" y="126" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="357" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="516" y="126" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="525" y="137" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

        <rect x="708" y="290" width="18" height="14" rx="2" fill="#f5f5f5"/>
        <text x="717" y="301" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
        <rect x="458" y="350" width="14" height="14" rx="2" fill="#f5f5f5"/>
        <text x="465" y="361" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- Route -->
        <rect x="60" y="80" width="280" height="174" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="60" y="80" width="280" height="48" rx="6" fill="#2d3142" fill-opacity="0.04"/>
        <rect x="60" y="120" width="280" height="8" fill="#2d3142" fill-opacity="0.04"/>
        <line x1="60" y1="128" x2="340" y2="128" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="80" y="98" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="80" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Route</text>
        <text x="80" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="320" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="80" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">code</text>
        <text x="320" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="80" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">name</text>
        <text x="320" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="80" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">active</text>
        <text x="320" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">bool</text>

        <!-- RouteStop (join) -->
        <rect x="560" y="80" width="280" height="200" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" fill-opacity="0.03"/>
        <rect x="560" y="80" width="280" height="48" rx="6" fill="#2d3142" fill-opacity="0.06"/>
        <rect x="560" y="120" width="280" height="8" fill="#2d3142" fill-opacity="0.06"/>
        <line x1="560" y1="128" x2="840" y2="128" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="580" y="98" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">JOIN</text>
        <text x="580" y="120" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">RouteStop</text>
        <text x="580" y="150" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="820" y="150" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="176" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ route_id</text>
        <text x="820" y="176" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="202" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">→ stop_id</text>
        <text x="820" y="202" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="580" y="228" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">sequence</text>
        <text x="820" y="228" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
        <text x="580" y="254" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">offset_minutes</text>
        <text x="820" y="254" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">int</text>

        <!-- Stop -->
        <rect x="310" y="400" width="280" height="174" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="310" y="400" width="280" height="48" rx="6" fill="#2d3142" fill-opacity="0.04"/>
        <rect x="310" y="440" width="280" height="8" fill="#2d3142" fill-opacity="0.04"/>
        <line x1="310" y1="448" x2="590" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="330" y="418" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="330" y="440" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Stop</text>
        <text x="330" y="470" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace"># id</text>
        <text x="570" y="470" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="330" y="496" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">name</text>
        <text x="570" y="496" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="330" y="522" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">latitude</text>
        <text x="570" y="522" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">decimal</text>
        <text x="330" y="548" fill="#2d3142" font-size="13.5" font-family="'Geist Mono', monospace">longitude</text>
        <text x="570" y="548" fill="#4f5d75" font-size="13.5" font-family="'Geist Mono', monospace" text-anchor="end">decimal</text>

        <!-- Legend -->
        <line x1="40" y1="620" x2="860" y2="620" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="640" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="656" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="64" y="666" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Entity</text>

        <rect x="140" y="656" width="16" height="12" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2" fill-opacity="0.04"/>
        <text x="164" y="666" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Join table</text>

        <text x="276" y="666" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="292" y="666" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Primary key</text>

        <text x="394" y="666" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="410" y="666" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Foreign key</text>

        <text x="510" y="666" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="550" y="666" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cardinality</text>
      </svg>
