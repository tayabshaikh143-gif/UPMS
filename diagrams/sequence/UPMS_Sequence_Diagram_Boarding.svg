<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-seq-board-title upms-seq-board-desc" id="UPMS_Sequence_Diagram_Boarding-root">
        <title id="upms-seq-board-title">UPMS boarding sequence</title>
        <desc id="upms-seq-board-desc">Sequence diagram of boarding: staff scan a ticket, the service validates it once, cash is collected when due, and the passenger is marked boarded.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Sequence_Diagram_Boarding-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Sequence_Diagram_Boarding-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Sequence_Diagram_Boarding-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Sequence_Diagram_Boarding-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Sequence_Diagram_Boarding-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="UPMS_Sequence_Diagram_Boarding-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="UPMS_Sequence_Diagram_Boarding-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="140" y1="128" x2="140" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="450" y1="128" x2="450" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="800" y1="128" x2="800" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>

        <rect x="446" y="168" width="8" height="424" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="212" width="8" height="60" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="432" width="8" height="24" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="136" y="344" width="8" height="64" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Fragment -->
        <rect x="128" y="300" width="760" height="260" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="128" y="300" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="148" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="152" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[valid · unused]</text>
        <line x1="136" y1="500" x2="880" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="140" y="514" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[invalid or reused]</text>

        <!-- Messages -->
        <line x1="140" y1="176" x2="446" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow-link)"/>
        <line x1="450" y1="220" x2="796" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>
        <line x1="800" y1="264" x2="458" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>
        <line x1="450" y1="352" x2="144" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>
        <line x1="140" y1="396" x2="446" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>
        <line x1="450" y1="440" x2="796" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>
        <line x1="450" y1="484" x2="144" y2="484" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow-accent)"/>
        <line x1="450" y1="536" x2="144" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>

        <!-- Labels -->
        <rect x="230" y="160" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="170" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCAN TICKET</text>

        <rect x="560" y="204" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="630" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK VALID + UNUSED</text>

        <rect x="560" y="248" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALID / INVALID</text>

        <rect x="230" y="330" width="150" height="12" rx="2" fill="#f5f5f5"/>
        <text x="305" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COLLECT CASH IF DUE</text>

        <rect x="230" y="374" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="290" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CASH RECORDED</text>

        <rect x="560" y="418" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="615" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MARK BOARDED</text>

        <rect x="230" y="462" width="90" height="12" rx="2" fill="#f5f5f5"/>
        <text x="275" y="472" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOARDED</text>

        <rect x="230" y="520" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="290" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOARDING DENIED</text>

        <!-- Actors -->
        <rect x="60" y="72" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="68" y="80" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="88" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAFF</text>
        <text x="140" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Boarding Staff</text>
        <text x="140" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scanner app</text>

        <rect x="370" y="72" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="378" y="80" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="394" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="450" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking Service</text>
        <text x="450" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UPMS API</text>

        <rect x="720" y="72" width="160" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="728" y="80" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="744" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
        <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bookings · boarding</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="960" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="672" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="62" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

        <rect x="168" y="668" width="4" height="18" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <text x="180" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="288" y1="678" x2="316" y2="678" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow-link)"/>
        <text x="324" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Request</text>

        <line x1="420" y1="678" x2="448" y2="678" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow)"/>
        <text x="456" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="560" y1="678" x2="588" y2="678" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Sequence_Diagram_Boarding-arrow-accent)"/>
        <text x="596" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

        <rect x="732" y="670" width="22" height="14" rx="3" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <text x="762" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Combined fragment</text>
      </svg>
