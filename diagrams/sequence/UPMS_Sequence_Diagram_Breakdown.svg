        <text x="616" y="721" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary notification</text>

        <rect x="772" y="710" width="22" height="14" rx="3" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <text x="802" y="721" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Combined fragment</text>
      </svg>
