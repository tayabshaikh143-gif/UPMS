        <rect x="488" y="300" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="508" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="512" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[replacement available]</text>
        <line x1="496" y1="416" x2="704" y2="416" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="512" y="430" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[no replacement]</text>

        <line x1="100" y1="176" x2="296" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow-link)"/>
        <line x1="300" y1="220" x2="696" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow)"/>
        <line x1="300" y1="264" x2="496" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow)"/>
        <line x1="500" y1="348" x2="304" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow)"/>
        <line x1="300" y1="388" x2="696" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow)"/>
        <line x1="500" y1="452" x2="304" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow)"/>
