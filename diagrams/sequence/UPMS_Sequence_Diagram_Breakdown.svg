        <line x1="300" y1="556" x2="886" y2="556" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow-open)"/>
        <line x1="300" y1="600" x2="496" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Breakdown-arrow)"/>

        <rect x="135" y="160" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="195" y="170" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT BREAKDOWN</text>

        <rect x="345" y="204" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE INCIDENT</text>

        <rect x="340" y="248" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALERT ADMIN</text>

        <rect x="330" y="330" width="150" height="12" rx="2" fill="#f5f5f5"/>
        <text x="405" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASSIGN REPLACEMENT</text>

        <rect x="340" y="372" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="382" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE SAME TRIP</text>

        <rect x="345" y="436" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="395" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CANCEL TRIP</text>

        <rect x="340" y="480" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECORD REFUND</text>

        <rect x="345" y="540" width="130" height="12" rx="2" fill="#f5f5f5"/>
        <text x="410" y="550" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTIFY PASSENGERS</text>

        <rect x="345" y="584" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="594" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS UPDATED</text>

        <!-- Actors -->
        <rect x="20" y="72" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="28" y="80" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
