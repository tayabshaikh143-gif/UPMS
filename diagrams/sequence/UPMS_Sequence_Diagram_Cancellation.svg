<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-seq-cancel-title upms-seq-cancel-desc" id="UPMS_Sequence_Diagram_Cancellation-root">
        <title id="upms-seq-cancel-title">UPMS cancellation sequence</title>
        <desc id="upms-seq-cancel-desc">Sequence diagram of cancelling a booking: the service checks the 20-minute cutoff, releases capacity, and records a refund when the ticket was paid online.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Sequence_Diagram_Cancellation-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Sequence_Diagram_Cancellation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Sequence_Diagram_Cancellation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Sequence_Diagram_Cancellation-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Sequence_Diagram_Cancellation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="UPMS_Sequence_Diagram_Cancellation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="UPMS_Sequence_Diagram_Cancellation-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="100" y1="128" x2="100" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="350" y1="128" x2="350" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="650" y1="128" x2="650" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>
        <line x1="880" y1="128" x2="880" y2="600" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.22"/>

        <rect x="346" y="168" width="8" height="424" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="646" y="212" width="8" height="60" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="646" y="332" width="8" height="60" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="876" y="420" width="8" height="24" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Fragment -->
        <rect x="88" y="300" width="880" height="260" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="88" y="300" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="108" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="112" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[at least 20 min before departure]</text>
        <line x1="96" y1="500" x2="960" y2="500" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="112" y="514" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[less than 20 min left]</text>

        <!-- Messages -->
        <line x1="100" y1="176" x2="346" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow-link)"/>
        <line x1="350" y1="220" x2="646" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>
        <line x1="650" y1="264" x2="358" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>
        <line x1="350" y1="340" x2="646" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>
        <line x1="650" y1="384" x2="358" y2="384" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>
        <line x1="350" y1="428" x2="876" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>
        <line x1="350" y1="472" x2="106" y2="472" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow-accent)"/>
        <line x1="350" y1="536" x2="106" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>

        <!-- Labels -->
        <rect x="171" y="160" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="225" y="170" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CANCEL BOOKING</text>

        <rect x="430" y="204" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK CUTOFF + STATUS</text>

        <rect x="430" y="248" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ELIGIBLE / TOO LATE</text>

        <rect x="410" y="324" width="170" height="12" rx="2" fill="#f5f5f5"/>
        <text x="495" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CANCEL + RELEASE CAPACITY</text>

        <rect x="430" y="368" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="378" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAPACITY RELEASED</text>

        <rect x="430" y="412" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REFUND (IF ONLINE)</text>

        <rect x="168" y="456" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="234" y="466" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOOKING CANCELLED</text>

        <rect x="168" y="520" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="234" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SELF-SERVICE CLOSED</text>

        <!-- Actors -->
        <rect x="20" y="72" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="28" y="80" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="44" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="100" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Passenger</text>
        <text x="100" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web / mobile</text>

        <rect x="270" y="72" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="278" y="80" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="294" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="350" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking Service</text>
        <text x="350" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UPMS API</text>

        <rect x="570" y="72" width="160" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="578" y="80" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="594" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="650" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text>
        <text x="650" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bookings · capacity</text>

        <rect x="800" y="72" width="160" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="808" y="80" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="824" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="880" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment Gateway</text>
        <text x="880" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refunds</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="960" y2="640" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="672" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="62" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal actor</text>

        <rect x="168" y="668" width="4" height="18" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <text x="180" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="288" y1="678" x2="316" y2="678" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow-link)"/>
        <text x="324" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Request</text>

        <line x1="420" y1="678" x2="448" y2="678" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow)"/>
        <text x="456" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="560" y1="678" x2="588" y2="678" stroke="#bf4520" stroke-width="1.4" marker-end="url(#UPMS_Sequence_Diagram_Cancellation-arrow-accent)"/>
        <text x="596" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary response</text>

        <rect x="732" y="670" width="22" height="14" rx="3" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <text x="762" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Combined fragment</text>
      </svg>
