<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="upms-seq-delay-title upms-seq-delay-desc" id="UPMS_Sequence_Diagram_Delay-root">
        <title id="upms-seq-delay-title">UPMS delay sequence</title>
        <desc id="upms-seq-delay-desc">Sequence diagram of a delayed trip: staff report the reason and revised ETA, the administrator approves it, the trip is updated and passengers are notified in the app.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #UPMS_Sequence_Diagram_Delay-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #UPMS_Sequence_Diagram_Delay-root { font-family: var(--font-sans); color: var(--color-ink); }
      #UPMS_Sequence_Diagram_Delay-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#UPMS_Sequence_Diagram_Delay-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="UPMS_Sequence_Diagram_Delay-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="UPMS_Sequence_Diagram_Delay-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="UPMS_Sequence_Diagram_Delay-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="UPMS_Sequence_Diagram_Delay-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

