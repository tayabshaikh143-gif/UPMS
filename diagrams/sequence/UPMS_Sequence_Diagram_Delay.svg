        <line x1="300" y1="396" x2="886" y2="396" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Delay-arrow-open)"/>
        <line x1="300" y1="440" x2="104" y2="440" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Delay-arrow)"/>
        <line x1="700" y1="484" x2="304" y2="484" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#UPMS_Sequence_Diagram_Delay-arrow)"/>

        <rect x="135" y="160" width="130" height="12" rx="2" fill="#f5f5f5"/>
        <text x="200" y="170" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT DELAY + ETA</text>

        <rect x="345" y="204" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE INCIDENT</text>

        <rect x="340" y="248" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALERT ADMIN</text>

        <rect x="340" y="292" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE NEW ETA</text>

        <rect x="340" y="336" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="346" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE TRIP ETA</text>

        <rect x="340" y="380" width="110" height="12" rx="2" fill="#f5f5f5"/>
        <text x="395" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN-APP UPDATE</text>

        <rect x="135" y="424" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="185" y="434" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACKNOWLEDGED</text>

        <rect x="345" y="468" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="395" y="478" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ETA SAVED</text>

        <!-- Actors -->
        <rect x="20" y="72" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="28" y="80" width="40" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="48" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STAFF</text>
        <text x="100" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Driver / Staff</text>
        <text x="100" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on the bus</text>

        <rect x="220" y="72" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
